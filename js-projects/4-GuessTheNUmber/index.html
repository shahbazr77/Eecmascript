<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Number Guessing Game</title>
</head>
<body style="background-color: #000;color: #fff;">
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try Guess a number between 1 and 100</p>
        <p>You have 10 attempts to guess the number</p>
    
         <form class="form">

            <label for="guessField" id="guess">Guess a number</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="guessSubmit" value="Submit guess" class="guessSubmit">
         </form>
         <div class="resultParas">
            <p>Previous Guesses: <span id="guesses"></span></p>
            <p>Guesses Remaining: <span id="lastResult">10</span></p>
            <p class="lowOrHi"></p>
         </div>

    </div>
    <script src="customjs.js"></script>
</body>
</html>
